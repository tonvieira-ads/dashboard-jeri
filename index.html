<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeri Brazil | Performance</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  color-scheme:dark;
  --bg:#0f0f0e;
  --surface:#1a1a19;
  --surface-2:#222221;
  --line:#2c2c2a;
  --text:#f0efec;
  --text-2:#c3c2b7;
  --text-3:#8d8c84;
  --s1:#3987e5;   /* azul: valor principal */
  --s2:#d95926;   /* laranja: comparação / média */
  --s3:#199e70;   /* aqua: recuperação */
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}
header{position:sticky;top:0;z-index:20;background:rgba(15,15,14,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:14px 16px 10px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:19px;font-weight:650;margin:0;letter-spacing:-.01em}
.brand span{color:var(--text-3);font-size:13px}
.upd{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(12,163,12,.18)}
.dot.old{background:var(--warn);box-shadow:0 0 0 3px rgba(250,178,25,.18)}
.dot.err{background:var(--crit);box-shadow:0 0 0 3px rgba(208,59,59,.18)}
button{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);color:var(--text-2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:#44443f;color:var(--text)}
.bar{max-width:1180px;margin:0 auto;padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.tabs,.presets{display:flex;gap:4px;flex-wrap:wrap}
.tab,.pre{background:transparent;border:1px solid transparent;color:var(--text-3);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:14px}
.tab:hover,.pre:hover{color:var(--text);background:var(--surface)}
.tab[aria-selected=true]{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.pre{font-size:13px;padding:6px 11px}
.pre[aria-pressed=true]{background:var(--s1);color:#fff}
.pre[aria-pressed=true]:hover{background:var(--s1)}
.range{color:var(--text-3);font-size:12.5px;padding:10px 0 0}
.range b{color:var(--text-2);font-weight:600}
section.blk{margin-top:22px}
h2{font-size:13px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin:0 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi .l{color:var(--text-3);font-size:13px}
.kpi .v{font-size:28px;font-weight:650;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.15}
.kpi .d{font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--text-3)}
.kpi .sub{font-size:12.5px;color:var(--text-3);margin-top:2px}
.chg{font-weight:600;display:inline-flex;gap:3px;align-items:center}
.chg.good{color:#3fcf5e}.chg.bad{color:#ff7a6b}.chg.flat{color:var(--text-3)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.ch h3{margin:0 0 2px;font-size:15px;font-weight:600}
.ch p{margin:0 0 8px;color:var(--text-3);font-size:12.5px}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 4px;font-size:12.5px;color:var(--text-2)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leg i.ln{height:2px;width:14px;border-radius:2px;vertical-align:3px}
.plot{position:relative;width:100%}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;z-index:5;background:#0c0c0b;border:1px solid #3a3a37;border-radius:8px;padding:8px 10px;font-size:12.5px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .08s}
.tip b{display:block;margin-bottom:4px;color:var(--text)}
.tip div{display:flex;justify-content:space-between;gap:14px;color:var(--text-2)}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tip span:last-child{color:var(--text);font-variant-numeric:tabular-nums}
.alerts{display:grid;gap:8px}
.al{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.al .ic{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0f0f0e;margin-top:1px}
.al.warn .ic{background:var(--warn)}.al.crit .ic{background:var(--crit);color:#fff}.al.ok .ic{background:var(--good);color:#fff}
.al small{display:block;color:var(--text-3);margin-top:2px;font-size:12.5px}
.tw{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,td.tl,th.tl{text-align:left}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--text-3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;z-index:1}
td{font-variant-numeric:tabular-nums;color:var(--text-2)}
tbody tr:hover td{background:rgba(255,255,255,.03)}
tr.tot td{font-weight:650;color:var(--text);background:var(--surface-2)}
details{margin-top:12px}
summary{cursor:pointer;color:var(--text-3);font-size:13px;padding:4px 0}
summary:hover{color:var(--text)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--text-2)}
.pill.pix{border-color:rgba(57,135,229,.5);color:#8fbcf2}.pill.card{border-color:rgba(217,89,38,.55);color:#f0a283}
.pill.wa{border-color:rgba(25,158,112,.55);color:#6fd3ae}
.note{color:var(--text-3);font-size:12.5px;margin-top:10px}
.state{padding:60px 16px;text-align:center;color:var(--text-3)}
.state h3{color:var(--text);margin:0 0 6px}
.skel{height:92px;border-radius:12px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
footer{margin-top:36px;color:var(--text-3);font-size:12.5px;text-align:center}
.hide{display:none}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{background:transparent;border:0;color:var(--text-3);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--text)}
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 10px;color:var(--text-3);font-size:13px}
.ctl select,.ctl input{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.ctl input{width:64px}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--text)}
th .ar{opacity:.9;margin-left:3px}
td.nm{max-width:360px;overflow:hidden;text-overflow:ellipsis}
td.nm small{display:block;color:var(--text-3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.rx{display:inline-block;min-width:58px;text-align:center;padding:2px 8px;border-radius:6px;font-weight:650;font-variant-numeric:tabular-nums}
.rx.g{background:rgba(12,163,12,.16);color:#5fd66e}.rx.y{background:rgba(250,178,25,.16);color:#fbc54e}.rx.r{background:rgba(208,59,59,.18);color:#ff8a7e}.rx.n{background:var(--surface-2);color:var(--text-3)}
.g6{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.champs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.champ{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.champ h4{margin:0 0 4px;font-size:14.5px;font-weight:600;line-height:1.3}
.champ .m{display:flex;gap:16px;flex-wrap:wrap;color:var(--text-3);font-size:12.5px;margin:6px 0 8px}
.champ .m b{color:var(--text);font-weight:600}
.champ ul{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--text-2)}
.champ li{padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.champ li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.champ .lb{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin-top:8px}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><h1>Jeri Brazil</h1><span>Performance de e-commerce</span></div>
    <div class="upd"><span class="dot" id="dot"></span><span id="updtxt">Carregando…</span><button class="btn" id="refresh" type="button">Atualizar</button></div>
  </div>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="geral">Visão geral</button>
      <button class="tab" role="tab" data-tab="campanhas">Campanhas</button>
      <button class="tab" role="tab" data-tab="pix">Pix</button>
      <button class="tab" role="tab" data-tab="recusados">Recusados</button>
      <button class="tab" role="tab" data-tab="recuperacao">Recuperação</button>
    </div>
    <div class="presets" id="presets">
      <button class="pre" data-p="7d">7 dias</button>
      <button class="pre" data-p="14d">14 dias</button>
      <button class="pre" data-p="30d">30 dias</button>
      <button class="pre" data-p="mes">Este mês</button>
      <button class="pre" data-p="mespassado">Mês passado</button>
      <button class="pre" data-p="tudo">Tudo</button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="range" id="range"></div>
  <main id="main"><div class="grid" style="margin-top:22px"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
  <footer>Fonte: Yampi (pedidos e carrinhos), atualizado automaticamente a cada hora. Valores em reais, fuso de Fortaleza. Somente pagamentos confirmados entram em vendas.</footer>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyoz6yO6m0OqMjLPEKFS1uPeWuMeWTDh6jxQRo3x-d0sILtrfJRKTuwly0wkZG-bpfW/exec';
const CORES = {s1:'#3987e5', s2:'#d95926', s3:'#199e70'};
const $ = s => document.querySelector(s);

/* ---------- formatação ---------- */
const nf0 = new Intl.NumberFormat('pt-BR', {maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('pt-BR', {maximumFractionDigits:1, minimumFractionDigits:1});
const brl0 = n => 'R$ ' + nf0.format(Math.round(n || 0));
const brl2 = n => (n || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const int = n => nf0.format(Math.round(n || 0));
const pct = n => (isFinite(n) ? nf1.format(n * 100) : '0,0') + '%';
const ddmm = s => s.slice(8, 10) + '/' + s.slice(5, 7);
const ddmmyy = s => ddmm(s) + '/' + s.slice(2, 4);
const compact = n => { const f = (x, u) => (Math.abs(x - Math.round(x)) < 0.05 ? nf0.format(Math.round(x)) : nf1.format(x)) + u; return n >= 1e6 ? f(n / 1e6, ' mi') : n >= 1e3 ? f(n / 1e3, ' mil') : nf0.format(Math.round(n)); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- datas ---------- */
const ymd = d => d.toISOString().slice(0, 10);
const addD = (s, n) => ymd(new Date(Date.parse(s + 'T00:00:00Z') + n * 864e5));
const diffD = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
const daysIn = (s, e) => { const o = []; for (let d = s; d <= e; d = addD(d, 1)) o.push(d); return o; };
const monthStart = s => s.slice(0, 8) + '01';
const prevMonthStart = s => monthStart(addD(monthStart(s), -1));

/* ---------- dados ---------- */
let D = null;                 // dados normalizados
const S = { tab: 'geral', p: '30d' };
const NUM = ['carrinhos_abandonados','valor_carrinhos','recuperados','valor_recuperado','pix_gerado','pix_pago','pix_valor_perdido','cartao_recusado','valor_cartao_recusado','recuperados_whatsapp','valor_recuperado_whatsapp','vendas_whatsapp_yampi','valor_vendas_whatsapp_yampi','pedidos_pagos','valor_pago'];

function normalizar(raw) {
  const idx = {};
  (raw.resumo_diario || []).forEach(r => {
    const o = { dia: String(r.dia).slice(0, 10) };
    NUM.forEach(k => o[k] = +r[k] || 0);
    idx[o.dia] = o;
  });
  const dias = Object.keys(idx).sort();
  const rec = (raw.recuperacao || []).map(r => ({
    criado: String(r.criado).slice(0, 10), valor_carrinho: +r.valor_carrinho || 0, metodo: r.metodo,
    emails: +r.emails_recuperacao || 0, recuperado: +r.recuperado ? 1 : 0, pedido: r.pedido,
    valor_pedido: +r.valor_pedido || 0, dias: r.dias_ate_compra, canal: r.canal || ''
  }));
  const rf = (raw.recusados || []).map(r => ({
    origem: r.origem, id: r.id, criado: String(r.criado).slice(0, 10), valor: +r.valor || 0,
    metodo: r.metodo, motivo: String(r.motivo || '')
  }));
  return { atualizado: raw.atualizado, idx, dias, primeiro: dias[0], rec, rf };
}
const row = d => D.idx[d];
const val = (d, k) => (D.idx[d] ? D.idx[d][k] : 0);

function agg(s, e) {
  const t = {}; NUM.forEach(k => t[k] = 0);
  daysIn(s, e).forEach(d => { const r = D.idx[d]; if (r) NUM.forEach(k => t[k] += r[k]); });
  t.ticket = t.pedidos_pagos ? t.valor_pago / t.pedidos_pagos : 0;
  t.conv_pix = t.pix_gerado ? t.pix_pago / t.pix_gerado : 0;
  t.taxa_rec = t.carrinhos_abandonados ? t.recuperados / t.carrinhos_abandonados : 0;
  return t;
}

/* ---------- período ---------- */
function hojeFortaleza() { return ymd(new Date(Date.parse(D.atualizado) - 3 * 36e5)); }
function periodo() {
  const hoje = hojeFortaleza(), fim = addD(hoje, -1);            // só dias completos
  let s, e = fim, ps = null, pe = null, nome = '';
  const n = { '7d': 7, '14d': 14, '30d': 30 }[S.p];
  if (n) { s = addD(fim, -(n - 1)); pe = addD(s, -1); ps = addD(pe, -(n - 1)); }
  else if (S.p === 'mes') {
    s = monthStart(hoje);
    if (s > fim) { s = prevMonthStart(hoje); e = addD(monthStart(hoje), -1); }
    const N = diffD(s, e) + 1; ps = prevMonthStart(s); pe = addD(ps, N - 1);
    if (pe >= s) pe = addD(s, -1);
  } else if (S.p === 'mespassado') {
    s = prevMonthStart(hoje); e = addD(monthStart(hoje), -1);
    const N = diffD(s, e) + 1; ps = prevMonthStart(s); pe = addD(ps, N - 1);
    if (pe >= s) pe = addD(s, -1);
  } else { s = D.primeiro; }
  if (s < D.primeiro) s = D.primeiro;
  if (ps && pe < D.primeiro) { ps = pe = null; }
  else if (ps && ps < D.primeiro) ps = D.primeiro;
  return { s, e, ps, pe, n: diffD(s, e) + 1, hoje };
}

/* ---------- deltas ---------- */
function delta(cur, prev, { bom = 'up', tipo = 'pct', fmt } = {}) {
  if (prev == null) return '';
  let txt, dir;
  if (tipo === 'pp') { const dd = (cur - prev) * 100; dir = Math.abs(dd) < 0.05 ? 0 : dd > 0 ? 1 : -1; txt = (dd > 0 ? '+' : '') + nf1.format(dd) + ' p.p.'; }
  else {
    if (!prev) return cur ? '<span class="chg flat">novo</span><span>vs período anterior</span>' : '';
    const dd = (cur - prev) / prev; dir = Math.abs(dd) < 0.0005 ? 0 : dd > 0 ? 1 : -1; txt = (dd > 0 ? '+' : '') + nf1.format(dd * 100) + '%';
  }
  const cls = (dir === 0 || bom === 'neutro') ? 'flat' : ((dir > 0) === (bom === 'up') ? 'good' : 'bad');
  const seta = dir === 0 ? '→' : dir > 0 ? '▲' : '▼';
  return `<span class="chg ${cls}">${seta} ${txt}</span><span>${fmt ? 'antes ' + fmt(prev) : 'vs período anterior'}</span>`;
}
function kpi(label, valor, cur, prev, o = {}) {
  return `<div class="card kpi"><div class="l">${label}</div><div class="v">${valor}</div>
  <div class="d">${prev == null ? '' : delta(cur, prev, o)}</div>${o.sub ? `<div class="sub">${o.sub}</div>` : ''}</div>`;
}

/* ---------- gráfico SVG ---------- */
let CHARTS = [];
function niceMax(m) {
  if (m <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(m))), f = m / p;
  const n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return n * p;
}
function chart(id, cfg) {                       // registra; desenha depois que o HTML entra na página
  CHARTS.push({ id, cfg });
  const leg = cfg.series.length > 1 ? `<div class="leg">${cfg.series.map(s => `<span><i class="${s.type === 'line' ? 'ln' : ''}" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="card ch"><h3>${esc(cfg.title)}</h3>${cfg.sub ? `<p>${esc(cfg.sub)}</p>` : ''}${leg}<div class="plot" id="${id}"></div></div>`;
}
function draw(id, cfg) {
  const host = document.getElementById(id); if (!host) return;
  const W = Math.max(280, host.clientWidth), H = cfg.h || 230, m = { l: 48, r: 10, t: 8, b: 26 };
  const L = cfg.labels, n = L.length, iw = W - m.l - m.r, ih = H - m.t - m.b, bw = iw / n;
  let mx = 0; cfg.series.forEach(s => s.vals.forEach(v => { if (v != null && v > mx) mx = v; }));
  const top = cfg.pct ? Math.max(0.2, Math.min(1, niceMax(mx * 1.05))) : niceMax(mx * 1.04);
  const y = v => m.t + ih - (v / top) * ih;
  const bars = cfg.series.filter(s => s.type === 'bar'), k = bars.length;
  const barW = k ? Math.max(1.5, Math.min(24, (bw * 0.78 - (k - 1) * 2) / k)) : 0, gW = k * barW + (k - 1) * 2;
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = top * i / 4, yy = y(v);
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="#2c2c2a" stroke-width="1"/>`;
    g += `<text x="${m.l - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="#8d8c84">${cfg.yfmt(v)}</text>`;
  }
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 58))));
  L.forEach((l, i) => { if (i % every === 0 || i === n - 1 && (n - 1) % every > every / 2) g += `<text x="${m.l + i * bw + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="11" fill="#8d8c84">${ddmm(l)}</text>`; });
  bars.forEach((s, bi) => s.vals.forEach((v, i) => {
    if (!(v > 0)) return;
    const x = m.l + i * bw + (bw - gW) / 2 + bi * (barW + 2), yy = y(v), h = m.t + ih - yy, r = Math.min(4, barW / 2, h);
    g += `<path d="M${x},${yy + h} L${x},${yy + r} Q${x},${yy} ${x + r},${yy} L${x + barW - r},${yy} Q${x + barW},${yy} ${x + barW},${yy + r} L${x + barW},${yy + h} Z" fill="${s.color}"/>`;
  }));
  cfg.series.filter(s => s.type === 'line').forEach(s => {
    let d = '', ult = null;
    s.vals.forEach((v, i) => { if (v == null) return; const x = m.l + i * bw + bw / 2; d += (d ? 'L' : 'M') + x + ',' + y(v); ult = [x, y(v)]; });

function abaGeral(P, c, p) {

  if (A) { const ee = P.e > A.ate ? A.ate : P.e, m = adsTot(P.s, ee); if (m.g >= 1000 && m.roas < METAROAS * 0.7) al.push(['warn', 'ROAS abaixo da meta', `ROAS atribuído de ${rx(m.roas)} com ${brl0(m.g)} investidos (meta ${rx(METAROAS)}).`]); }

/* ---------- anúncios (Meta) ---------- */
let A = null;
const nf2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const rx = n => nf2.format(n || 0) + 'x';
let METAROAS = 4; try { const v = parseFloat(localStorage.getItem('jeri_meta_roas')); if (v > 0) METAROAS = v; } catch (e) {}
S.lvl = 'c'; S.min = 100; S.sort = { k: 'roas', d: -1 };

function prepAds(raw) {
  const L = raw.linhas.map(l => ({ d: l[0], c: l[1], s: l[2], a: l[3], sp: l[4], n: l[5], rv: l[6] }));
  const byDay = {};
  L.forEach(r => { const x = byDay[r.d] = byDay[r.d] || [0, 0, 0]; x[0] += r.sp; x[1] += r.n; x[2] += r.rv; });
  return { nomes: raw.nomes, L, byDay, ate: raw.ate, gerado: raw.gerado };
}
const nm = k => (A.nomes[String(k)] || '#' + k);
function adsTot(s, e) {
  let g = 0, n = 0, r = 0;
  daysIn(s, e).forEach(d => { const x = A.byDay[d]; if (x) { g += x[0]; n += x[1]; r += x[2]; } });
  return { g, n, r, roas: g ? r / g : 0, cpa: n ? g / n : 0 };
}
function roas7(d) {
  let g = 0, r = 0;
  for (let i = 0; i < 7; i++) { const x = A.byDay[addD(d, -i)]; if (x) { g += x[0]; r += x[2]; } }
  return g ? r / g : null;
}
const ehVendas = n => /^vendas/i.test(n) && !/atacado|cat[aá]logo/i.test(n);

function adsNivel(s, e, nivel) {
  const rows = A.L.filter(r => r.d >= s && r.d <= e);
  const cm = {};
  rows.forEach(r => { const x = cm[r.c] = cm[r.c] || [0, 0]; x[0] += r.rv; if (r.a < 0) x[1] += r.rv; });
  const dyn = id => cm[id] && cm[id][0] > 0 && cm[id][1] / cm[id][0] >= 0.8;     // catálogo/dinâmico: receita sem ID de anúncio
  const m = new Map(); let ocultos = 0;
  rows.forEach(r => {
    let key, nome, sub = '';
    if (nivel === 'c') { key = r.c; nome = nm(r.c); }
    else if (nivel === 's') { if (r.s < 0) return; key = r.s; nome = nm(r.s); sub = nm(r.c); }
    else { if (r.a < 0) return; if (dyn(r.c)) { ocultos += r.sp; return; } nome = nm(r.a); key = nome; sub = ''; }
    let x = m.get(key);
    if (!x) m.set(key, x = { key, nome, sub, g: 0, n: 0, rv: 0, conj: new Set(), camp: new Set() });
    x.g += r.sp; x.n += r.n; x.rv += r.rv;
    if (r.s >= 0) x.conj.add(r.s); x.camp.add(r.c);
  });
  m.forEach(x => { x.roas = x.g ? x.rv / x.g : 0; x.cpa = x.n ? x.g / x.n : 0; });
  return { m, ocultos };
}
const rxCls = (v, g) => g < 1 ? 'n' : v >= METAROAS ? 'g' : v >= METAROAS * 0.7 ? 'y' : 'r';
const rxTag = (v, g) => `<span class="rx ${rxCls(v, g)}">${g < 1 ? '-' : rx(v)}</span>`;

function midiaKpis(P, c, p) {
  if (!A) return '';
  const e = P.e > A.ate ? A.ate : P.e, a = adsTot(P.s, e), b = P.ps ? adsTot(P.ps, P.pe > A.ate ? A.ate : P.pe) : null;
  const geral = a.g ? c.valor_pago / a.g : 0, geralP = b && b.g && p ? p.valor_pago / b.g : null;
  return `<section class="blk"><h2>Mídia paga (Meta)</h2><div class="grid">
    ${kpi('Investimento', brl0(a.g), a.g, b && b.g, { bom: 'neutro', sub: 'gasto no Meta Ads' })}
    ${kpi('ROAS atribuído', rx(a.roas), a.roas, b && b.roas, { sub: `meta ${rx(METAROAS)} · receita ${brl0(a.r)}` })}
    ${kpi('Custo por compra', brl2(a.cpa), a.cpa, b && b.cpa, { bom: 'down', sub: `${int(a.n)} compras atribuídas` })}
    ${kpi('ROAS geral', rx(geral), geral, geralP, { sub: 'vendas pagas totais ÷ investimento' })}
  </div></section>`;
}

function tabelaRank(P, nivel) {
  const e = P.e > A.ate ? A.ate : P.e;
  const cur = adsNivel(P.s, e, nivel), prev = P.ps ? adsNivel(P.ps, P.pe > A.ate ? A.ate : P.pe, nivel).m : null;
  const tot = [...cur.m.values()].reduce((t, x) => t + x.g, 0) || 1;
  let list = [...cur.m.values()];
  const baixo = list.filter(x => x.g < S.min).length;
  list = list.filter(x => x.g >= S.min);
  const k = S.sort.k, d = S.sort.d;
  list.sort((x, y) => k === 'nome' ? d * x.nome.localeCompare(y.nome) : d * ((x[k] || 0) - (y[k] || 0)));
  const th = (key, lab, left) => `<th data-sort="${key}" class="${left ? 'tl' : ''}">${lab}${S.sort.k === key ? `<span class="ar">${S.sort.d < 0 ? '▼' : '▲'}</span>` : ''}</th>`;
  const lin = list.slice(0, 200).map(x => {
    const pv = prev && prev.get(x.key);
    const nome = `<td class="tl nm" title="${esc(x.nome)}">${esc(x.nome)}${x.sub ? `<small>${esc(x.sub)}</small>` : ''}${nivel === 'a' ? `<small>roda em ${x.conj.size} ${x.conj.size === 1 ? 'conjunto' : 'conjuntos'}</small>` : ''}</td>`;
    return `<tr>${nome}<td>${brl0(x.g)}</td><td>${pct(x.g / tot)}</td><td>${int(x.n)}</td><td>${brl0(x.rv)}</td><td>${rxTag(x.roas, x.g)}</td><td>${x.n ? brl2(x.cpa) : '-'}</td><td>${pv && pv.g >= 1 ? rx(pv.roas) : '-'}</td></tr>`;
  });
  const cab = `<tr>${th('nome', nivel === 'c' ? 'Campanha' : nivel === 's' ? 'Conjunto' : 'Criativo', true)}${th('g', 'Gasto')}${th('g', '% do gasto').replace('data-sort="g"', 'data-sort="g"')}${th('n', 'Compras')}${th('rv', 'Receita')}${th('roas', 'ROAS')}${th('cpa', 'Custo/compra')}<th>ROAS anterior</th></tr>`;
  const nota = [];
  if (baixo) nota.push(`${baixo} ${baixo === 1 ? 'item' : 'itens'} com gasto abaixo de ${brl0(S.min)} ${baixo === 1 ? 'oculto' : 'ocultos'}.`);
  if (nivel === 'a' && cur.ocultos > 0) nota.push(`Campanhas de catálogo (${brl0(cur.ocultos)} investidos) não entram aqui: a venda delas não traz o ID do anúncio, então só dá para medir por campanha e conjunto.`);
  if (nivel === 'a') nota.push('Criativos com o mesmo nome em vários conjuntos aparecem somados. Parte das vendas (6% a 26% por campanha) não traz o ID do anúncio, então o ROAS por criativo tende a ficar um pouco abaixo do real.');
  return `<div class="tw"><table><thead>${cab}</thead><tbody>${lin.join('')}</tbody></table></div>${nota.length ? `<p class="note">${nota.join(' ')}</p>` : ''}`;
}

function replicar(P) {
  const e = P.e > A.ate ? A.ate : P.e, cr = adsNivel(P.s, e, 'a').m, cj = adsNivel(P.s, e, 's').m;
  const lista = [...cr.values()].filter(x => x.g >= 150 && x.n >= 3).sort((a, b) => b.roas - a.roas);
  const campeoes = lista.filter(x => x.roas > 0).slice(0, 4);
  // conjuntos de vendas ativos nos últimos 7 dias dos dados
  const ini7 = addD(A.ate, -6), gasto7 = {};
  A.L.forEach(r => { if (r.d >= ini7 && r.s >= 0) gasto7[r.s] = (gasto7[r.s] || 0) + r.sp; });
  const ativos = Object.keys(gasto7).filter(k => gasto7[k] >= 30).map(Number).filter(k => cj.get(k) && ehVendas(cj.get(k).sub));
  const rodaEm = {};   // nome do criativo -> conjuntos onde teve gasto
  A.L.forEach(r => { if (r.d >= P.s && r.d <= e && r.a >= 0) (rodaEm[nm(r.a)] = rodaEm[nm(r.a)] || new Set()).add(r.s); });
  const card = x => {
    const ja = rodaEm[x.nome] || new Set();
    const sug = ativos.filter(id => !ja.has(id)).map(id => cj.get(id)).sort((a, b) => b.roas - a.roas).slice(0, 3);
    return `<div class="champ"><h4>${esc(x.nome)}</h4>
      <div class="m"><span>ROAS <b>${rx(x.roas)}</b>${x.n < 5 || x.g < 300 ? ' <i style="color:#fbc54e;font-style:normal">(amostra pequena)</i>' : ''}</span><span>Gasto <b>${brl0(x.g)}</b></span><span>Compras <b>${int(x.n)}</b></span><span>Custo/compra <b>${brl2(x.cpa)}</b></span></div>
      <div class="lb">Roda em ${ja.size} ${ja.size === 1 ? 'conjunto' : 'conjuntos'}</div>
      <div class="lb">Ainda não roda em (conjuntos de vendas ativos)</div>
      ${sug.length ? `<ul>${sug.map(z => `<li><span title="${esc(z.nome)}">${esc(z.nome)}</span><span>${rx(z.roas)}</span></li>`).join('')}</ul>` : '<p class="note" style="margin:6px 0 0">Já roda em todos os conjuntos de vendas ativos.</p>'}</div>`;
  };
  const rev = [...cr.values()].filter(x => x.g >= Math.max(300, 0) && x.roas < METAROAS * 0.5).sort((a, b) => b.g - a.g).slice(0, 5);
  return `<section class="blk"><h2>Criativos para replicar</h2>
    ${campeoes.length ? `<div class="champs">${campeoes.map(card).join('')}</div>` : '<div class="card"><p class="note" style="margin:0">Nenhum criativo com gasto acima de R$ 150 e 3 compras no período.</p></div>'}
    <p class="note">Campeões: maior ROAS entre criativos com pelo menos R$ 150 de gasto e 3 compras. A lista de conjuntos mostra onde o criativo ainda não rodou no período, ordenada pelo ROAS do conjunto. É uma sugestão de teste, não garantia de resultado.</p></section>
    ${rev.length ? `<section class="blk"><h2>Revisar: gastando com retorno baixo</h2>${tabela(['Criativo', 'Gasto', 'Receita', 'ROAS', 'Compras'], rev.map(x => tr([esc(x.nome), brl0(x.g), brl0(x.rv), rxTag(x.roas, x.g), int(x.n)])))}<p class="note">Criativos com gasto acima de R$ 300 e ROAS abaixo de metade da meta (${rx(METAROAS * 0.5)}).</p></section>` : ''}`;
}

function abaCampanhas(P, c, p) {
  if (!A) return `<div class="state"><h3>Dados de campanha indisponíveis</h3><p>Não foi possível carregar o arquivo de campanhas.</p></div>`;
  const e = P.e > A.ate ? A.ate : P.e, pe = P.ps ? (P.pe > A.ate ? A.ate : P.pe) : null;
  const a = adsTot(P.s, e), b = P.ps ? adsTot(P.ps, pe) : null, ds = daysIn(P.s, e);
  const geral = a.g ? c.valor_pago / a.g : 0, geralP = b && b.g && p ? p.valor_pago / b.g : null;
  return `<section class="blk"><div class="ctl"><span>Meta de ROAS <input id="meta" type="number" step="0.1" min="0.5" value="${METAROAS}"></span><span>Verde: na meta ou acima · Amarelo: de 70% a 100% da meta · Vermelho: abaixo de 70%. Dados de campanha até ${ddmmyy(A.ate)}.</span></div>
  <div class="grid g6">
    ${kpi('Investimento', brl0(a.g), a.g, b && b.g, { bom: 'neutro', sub: 'Meta Ads' })}
    ${kpi('Receita atribuída', brl0(a.r), a.r, b && b.r, { sub: 'vendas pagas com origem nos anúncios' })}
    ${kpi('ROAS atribuído', rx(a.roas), a.roas, b && b.roas, { sub: `meta ${rx(METAROAS)}` })}
    ${kpi('Compras atribuídas', int(a.n), a.n, b && b.n)}
    ${kpi('Custo por compra', brl2(a.cpa), a.cpa, b && b.cpa, { bom: 'down' })}
    ${kpi('ROAS geral', rx(geral), geral, geralP, { sub: 'todas as vendas pagas ÷ investimento' })}
  </div></section>
  <section class="blk two">
    ${chart('m1', { title: 'Investimento e receita por dia', sub: 'Receita atribuída pelos anúncios.', labels: ds, yfmt: v => compact(v), h: 240, series: [
      { name: 'Investimento', type: 'bar', color: CORES.s1, vals: ds.map(d => (A.byDay[d] || [0])[0]), fmt: brl0 },
      { name: 'Receita atribuída', type: 'bar', color: CORES.s3, vals: ds.map(d => (A.byDay[d] || [0, 0, 0])[2]), fmt: brl0 }] })}
    ${chart('m2', { title: 'ROAS atribuído (média de 7 dias)', sub: 'Receita ÷ investimento nos 7 dias até cada data.', labels: ds, yfmt: v => nf1.format(v) + 'x', h: 240, series: [
      { name: 'ROAS', type: 'line', color: CORES.s1, vals: ds.map(roas7), fmt: rx },
      { name: 'Meta', type: 'line', color: '#8d8c84', vals: ds.map(() => METAROAS), fmt: rx }] })}
  </section>
  ${replicar(P)}
  <section class="blk"><h2>Ranking</h2>
    <div class="ctl"><div class="seg" id="lvl"><button data-lvl="c" aria-pressed="${S.lvl === 'c'}">Campanhas</button><button data-lvl="s" aria-pressed="${S.lvl === 's'}">Conjuntos</button><button data-lvl="a" aria-pressed="${S.lvl === 'a'}">Criativos</button></div>
    <span>Gasto mínimo <select id="min">${[0, 50, 100, 300, 500].map(v => `<option value="${v}" ${S.min === v ? 'selected' : ''}>${v ? 'R$ ' + v : 'todos'}</option>`).join('')}</select></span>
    <span>Clique no título da coluna para ordenar.</span></div>
    ${tabelaRank(P, S.lvl)}
    <p class="note">Receita e compras vêm dos pedidos pagos com UTM do anúncio. Pedidos sem UTM (direto, orgânico, Google) não entram no ROAS atribuído, por isso o ROAS geral é maior. Google Ads não está incluído.</p></section>`;
}

/* ---------- render ---------- */
function render() {
  if (!D) return;
  const P = periodo(), c = agg(P.s, P.e), p = P.ps ? agg(P.ps, P.pe) : null;
  $('#range').innerHTML = `<b>${ddmmyy(P.s)} a ${ddmmyy(P.e)}</b> (${P.n} ${P.n === 1 ? 'dia' : 'dias'})` + (P.ps ? ` · comparado com ${ddmmyy(P.ps)} a ${ddmmyy(P.pe)}` : ' · sem comparação') + ' · dias completos, até ontem';
  CHARTS = [];
  const f = { geral: abaGeral, campanhas: abaCampanhas, pix: abaPix, recusados: abaRecusados, recuperacao: abaRecuperacao }[S.tab];
  $('#main').innerHTML = f(P, c, p);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  document.querySelectorAll('.pre').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === S.p));
  drawAll();
}
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawAll, 120); });

/* ---------- carga ---------- */
function status(txt, cls) { $('#updtxt').textContent = txt; $('#dot').className = 'dot ' + (cls || ''); }
function quando() {
  if (!D) return;
  const t = new Date(D.atualizado), min = Math.round((Date.now() - t) / 6e4);
  const hora = t.toLocaleString('pt-BR', { timeZone: 'America/Fortaleza', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  status(`Dados de ${hora}` + (min < 90 ? '' : ' (atrasado)'), min < 150 ? '' : 'old');
}
async function carregarAds() {
  try {
    const r = await fetch('campanhas.json?v=' + Math.floor(Date.now() / 36e5));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    A = prepAds(await r.json()); render();
  } catch (e) { /* aba Campanhas mostra aviso */ }
}
async function carregar(manual) {
  const btn = $('#refresh'); btn.disabled = true; if (manual) status('Atualizando…');
  try {
    const r = await fetch(API, { redirect: 'follow' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = await r.json();
    D = normalizar(raw); try { localStorage.setItem('jeri_cache', JSON.stringify(raw)); } catch (e) {}
    quando(); render(); carregarAds();
  } catch (e) {
    if (!D) {
      status('Sem conexão com os dados', 'err');
      $('#main').innerHTML = `<div class="state"><h3>Não foi possível carregar os dados</h3><p>Verifique a internet e tente de novo.</p><button class="btn" onclick="carregar(true)">Tentar novamente</button></div>`;
    } else { status('Falha ao atualizar, mostrando dados anteriores', 'old'); }
  } finally { btn.disabled = false; }
}
document.addEventListener('click', e => {
  const t = e.target.closest('.tab'), p = e.target.closest('.pre');
  if (t) { S.tab = t.dataset.tab; try { history.replaceState(null, '', '#' + S.tab); } catch (x) {} render(); window.scrollTo({ top: 0 }); }
  if (p) { S.p = p.dataset.p; render(); }
  const lv = e.target.closest('[data-lvl]'), so = e.target.closest('th[data-sort]');
  if (lv) { S.lvl = lv.dataset.lvl; S.sort = { k: 'roas', d: -1 }; render(); }
  if (so) { const k = so.dataset.sort; S.sort = S.sort.k === k ? { k, d: -S.sort.d } : { k, d: k === 'nome' ? 1 : -1 }; render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'min') { S.min = +e.target.value; render(); }
  if (e.target.id === 'meta') { const v = parseFloat(String(e.target.value).replace(',', '.')); if (v > 0) { METAROAS = v; try { localStorage.setItem('jeri_meta_roas', String(v)); } catch (x) {} render(); } }
});
$('#refresh').addEventListener('click', () => carregar(true));
(function init() {
  const h = location.hash.slice(1); if (['geral', 'campanhas', 'pix', 'recusados', 'recuperacao'].includes(h)) S.tab = h;
  try { const c = localStorage.getItem('jeri_cache'); if (c) { D = normalizar(JSON.parse(c)); quando(); render(); } } catch (e) {}
  carregar(false);
  setInterval(() => carregar(false), 10 * 60 * 1000);
})();
</script>
</body>
</html>
